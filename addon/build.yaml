# Der Supervisor reicht diesen Wert als BUILD_FROM ins Dockerfile.
#
# Bewusst das FERTIGE App-Image statt eines Neubaus aus dem Quelltext: Der
# Supervisor baut auf der Home-Assistant-Kiste selbst, und ein Next.js-Build
# dauert dort je nach Gerät zwanzig Minuten und mehr. So wird nur noch
# Postgres obendrauf gelegt — das sind Sekunden.
#
# Beim Anheben auf eine neue Version muss auch `version` in config.yaml mit,
# sonst bietet Home Assistant kein Update an.
#
# Bewusst -ha und nicht das normale Abbild: dieses hier ist mit dem
# Ingress-Platzhalter gebaut, den run.sh beim Start durch den echten Pfad
# ersetzt. Ein Compose-Nutzer bekäme davon ein .next, das erst umgeschrieben
# werden muss — das Add-on-Risiko liefe im Hauptprodukt mit.
build_from:
  amd64: ghcr.io/jeremiaa/magic-frame-app-ha:1.6.0
  aarch64: ghcr.io/jeremiaa/magic-frame-app-ha:1.6.0
