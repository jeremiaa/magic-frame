# Der Supervisor reicht diesen Wert als BUILD_FROM ins Dockerfile.
#
# Bewusst das FERTIGE App-Image statt eines Neubaus aus dem Quelltext: Der
# Supervisor baut auf der Home-Assistant-Kiste selbst, und ein Next.js-Build
# dauert dort je nach Gerät zwanzig Minuten und mehr. So wird nur noch
# Postgres obendrauf gelegt — das sind Sekunden.
#
# Beim Anheben auf eine neue Version muss auch `version` in config.yaml mit,
# sonst bietet Home Assistant kein Update an.
#
# Bewusst das NORMALE Abbild, nicht -ha.
#
# Das -ha-Abbild wird mit einem Ingress-Platzhalter als basePath gebaut. Der
# Schritt, der ihn beim Start durch den echten Pfad ersetzt, existiert nicht:
# run.sh fragt den Supervisor nie nach ingress_entry, ruft scripts/mf-basepath.mjs
# nie auf und exportiert MF_BASE_PATH nie. Ausserdem steht ENV MF_BASE_PATH nur
# in der builder-Stufe des Dockerfiles, nicht in der runner-Stufe.
#
# Folge in 1.5.1: die Client-Bundles trugen den Platzhalter einbetoniert, der
# Server lief auf "/". Das war nicht nur im HA-Rahmen kaputt, sondern auch am
# direkten Port — jeder router.push zielte ins Leere.
#
# Bis die Einbettung wirklich gebaut ist, gehoert hier das Abbild hin, das auch
# die Compose-Nutzer fahren. Kein Platzhalter, kein Sonderweg.
build_from:
  amd64: ghcr.io/jeremiaa/magic-frame-app:1.5.3
  aarch64: ghcr.io/jeremiaa/magic-frame-app:1.5.3
