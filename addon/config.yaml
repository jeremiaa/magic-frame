name: Magic Frame
version: "1.5.3"
slug: magic_frame
description: Dashboard for tablets, monitors, wall panels and picture frames
url: https://github.com/jeremiaa/magic-frame
# Nur die Architekturen, für die es ein veröffentlichtes App-Image gibt —
# release-images.yml baut amd64 + arm64. armv7 fehlt bewusst, sonst schlägt
# der Supervisor-Build bei Pi-Zero-Nutzern mit einer unverständlichen
# Manifest-Meldung fehl.
arch:
  - amd64
  - aarch64
init: false
# Ingress trägt Magic Frame in die Seitenleiste ein — aber nur als Startseite
# mit Ein-Klick-Anmeldung, nicht als eingebettete App: Next.js betoniert
# seinen Basis-Pfad beim Bauen ein, der Ingress-Pfad steht aber erst nach der
# Installation fest. Der Editor öffnet deshalb als eigene Seite auf dem
# direkten Port. Wandtablets rufen /view/<id> weiterhin dort auf — hinter
# Ingress ginge das nie, der Pfad verlangt eine angemeldete HA-Sitzung.
# Ein-/Ausblenden des Eintrags: der "In Seitenleiste anzeigen"-Schalter auf
# der Add-on-Seite von Home Assistant selbst.
ingress: true
ingress_port: 8099
panel_icon: mdi:image-frame
panel_title: Magic Frame
# Versteckt den Eintrag vor Nicht-Admins. Das ist NUR Sichtbarkeit — den
# eigentlichen Schutz macht server-ingress.js, indem es den anfragenden
# HA-Nutzer gegen die Admin-Liste von Home Assistant prüft.
panel_admin: true
ports:
  3000/tcp: 8098
ports_description:
  3000/tcp: Web-Oberfläche (Editor und Ansichten)
# Erlaubt den Zugriff auf Home Assistant über den Supervisor-Proxy. Damit
# braucht niemand mehr einen langlebigen Zugriffstoken anzulegen — die App
# erkennt das selbst (src/lib/runtime/addon.ts).
homeassistant_api: true
# Der Supervisor hält das Add-on vorm Sichern an. Bei einer eingebauten
# Datenbank ist das der Unterschied zwischen einer sauberen Sicherung und
# einer, die beim Zurückspielen nicht startet.
backup: cold
options:
  admin_email: ""
  admin_password: ""
  timezone: ""
  ha_action_unrestricted: false
  ha_auto_login: true
  sidebar_mode: launcher
schema:
  admin_email: str?
  admin_password: password?
  timezone: str?
  # Ein Display darf nur die Entitäten schalten, die auf einer Ansicht liegen.
  # Diese Option hebt das auf. Nur einschalten, wenn etwas anderes (ein eigenes
  # Modul, ein Skript) Entitäten anspricht, die nirgends platziert sind.
  ha_action_unrestricted: bool?
  # Der Seitenleisten-Klick meldet HA-Admins ohne Passwort an. Aus = die
  # Startseite verlinkt nur noch auf die normale Anmeldung.
  ha_auto_login: bool?
  # launcher = Startseite mit einem Knopf, der einen neuen Tab öffnet. Das ist
  #   derzeit der einzige Modus, der wirklich funktioniert.
  # embedded = im HA-Rahmen. NOCH NICHT FERTIG: dafuer muesste die App unter dem
  #   Ingress-Pfad laufen, und der Schritt, der ihn setzt, fehlt (siehe
  #   build.yaml). Wer es waehlt, bekommt automatisch wieder die Startseite,
  #   mit einer Zeile im Protokoll. Kaputt geht dabei nichts.
  sidebar_mode: list(embedded|launcher)?
# Kein `image:` — der Supervisor baut aus dem Dockerfile. Ein leeres oder
# null-Feld liest er als "Image erwartet" und bricht mit einer irreführenden
# Meldung ab.
