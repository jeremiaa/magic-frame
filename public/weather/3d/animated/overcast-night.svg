<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><style>@keyframes mf3dspin{to{transform:rotate(360deg)}}.a-spin{animation:mf3dspin 80s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes mf3dbob{0%,100%{transform:translateX(0)}50%{transform:translateX(9px)}}.a-bob{animation:mf3dbob 7s ease-in-out infinite}@keyframes mf3dbob2{0%,100%{transform:translateX(0)}50%{transform:translateX(-11px)}}.a-bob2{animation:mf3dbob2 9s ease-in-out infinite}@keyframes mf3dfall{0%{transform:translateY(-12px);opacity:0}22%{opacity:1}70%{opacity:1}100%{transform:translateY(24px);opacity:0}}.a-fall{animation:mf3dfall 1.7s linear infinite}@keyframes mf3ddrift{0%{transform:translate(0,-12px) rotate(0deg);opacity:0}25%{opacity:1}70%{opacity:1}100%{transform:translate(7px,22px) rotate(38deg);opacity:0}}.a-drift{animation:mf3ddrift 3.2s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes mf3dflash{0%,7%,100%{opacity:1}2%{opacity:.1}4%{opacity:.95}5%{opacity:.5}}.a-flash{animation:mf3dflash 3.8s linear infinite}@keyframes mf3dslide{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}.a-slide{animation:mf3dslide 6s ease-in-out infinite}@keyframes mf3dslider{0%,100%{transform:translateX(0)}50%{transform:translateX(-14px)}}.a-slide-r{animation:mf3dslider 6s ease-in-out infinite}@keyframes mf3dtwinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}.a-twinkle{animation:mf3dtwinkle 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><linearGradient id="mf3d-overcast-night-moong" x1="0" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="#eef4fc"/><stop offset="1" stop-color="#a7bce6"/></linearGradient><linearGradient id="mf3d-overcast-night-cloudg" x1="0" y1="120" x2="0" y2="330" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f7fafd"/><stop offset="1" stop-color="#d9e5f5"/></linearGradient><linearGradient id="mf3d-overcast-night-darkg" x1="0" y1="120" x2="0" y2="330" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#d3e0f3"/><stop offset="1" stop-color="#a9c0e6"/></linearGradient></defs><mask id="mf3d-overcast-night-mon"><rect x="-300" y="-300" width="1112" height="1112" fill="#000"/><circle cx="178" cy="148" r="86.0" fill="#fff"/><circle cx="256.0" cy="86.0" r="80.83999999999999" fill="#000"/></mask><g mask="url(#mf3d-overcast-night-mon)"><circle cx="178" cy="148" r="86.0" fill="url(#mf3d-overcast-night-moong)"/><circle cx="123.0" cy="138.0" r="20.0" fill="#8ba6d8" opacity="0.75"/><circle cx="156.0" cy="210.0" r="14.0" fill="#8ba6d8" opacity="0.7"/><circle cx="106.0" cy="194.0" r="9.0" fill="#8ba6d8" opacity="0.65"/><ellipse cx="126.0" cy="36.0" rx="34.0" ry="11.0" fill="#ffffff" opacity="0.85" transform="rotate(-32 126.0 36.0)"/></g><circle class="a-twinkle" cx="420" cy="96" r="6" fill="#ffb023"/><g class="a-twinkle" style="animation-delay:1s" fill="#fcb646"><polygon points="448.0,175.0 451.6,186.4 463.0,190.0 451.6,193.6 448.0,205.0 444.4,193.6 433.0,190.0 444.4,186.4"/></g><g transform="translate(24,104) scale(0.96)"><g class="a-bob"><g fill="#8ca7d8" transform="translate(3,13)"><rect x="132" y="210" width="248" height="100" rx="46"/><circle cx="172" cy="244" r="64"/><circle cx="258" cy="214" r="88"/><circle cx="342" cy="246" r="60"/></g><g fill="url(#mf3d-overcast-night-darkg)"><rect x="132" y="210" width="248" height="100" rx="46"/><circle cx="172" cy="244" r="64"/><circle cx="258" cy="214" r="88"/><circle cx="342" cy="246" r="60"/></g><ellipse cx="234" cy="158" rx="24" ry="8" fill="#eef4fc" opacity="0.85" transform="rotate(-14 234 158)"/><ellipse cx="156" cy="214" rx="12" ry="6" fill="#eef4fc" opacity="0.65" transform="rotate(-30 156 214)"/></g></g></svg>