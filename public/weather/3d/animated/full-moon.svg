<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><style>@keyframes mf3dspin{to{transform:rotate(360deg)}}.a-spin{animation:mf3dspin 80s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes mf3dbob{0%,100%{transform:translateX(0)}50%{transform:translateX(9px)}}.a-bob{animation:mf3dbob 7s ease-in-out infinite}@keyframes mf3dbob2{0%,100%{transform:translateX(0)}50%{transform:translateX(-11px)}}.a-bob2{animation:mf3dbob2 9s ease-in-out infinite}@keyframes mf3dfall{0%{transform:translateY(-12px);opacity:0}22%{opacity:1}70%{opacity:1}100%{transform:translateY(24px);opacity:0}}.a-fall{animation:mf3dfall 1.7s linear infinite}@keyframes mf3ddrift{0%{transform:translate(0,-12px) rotate(0deg);opacity:0}25%{opacity:1}70%{opacity:1}100%{transform:translate(7px,22px) rotate(38deg);opacity:0}}.a-drift{animation:mf3ddrift 3.2s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes mf3dflash{0%,7%,100%{opacity:1}2%{opacity:.1}4%{opacity:.95}5%{opacity:.5}}.a-flash{animation:mf3dflash 3.8s linear infinite}@keyframes mf3dslide{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}.a-slide{animation:mf3dslide 6s ease-in-out infinite}@keyframes mf3dslider{0%,100%{transform:translateX(0)}50%{transform:translateX(-14px)}}.a-slide-r{animation:mf3dslider 6s ease-in-out infinite}@keyframes mf3dtwinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}.a-twinkle{animation:mf3dtwinkle 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><linearGradient id="mf3d-full-moon-moong" x1="0" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="#eef4fc"/><stop offset="1" stop-color="#a7bce6"/></linearGradient></defs><clipPath id="mf3d-full-moon-fmclip"><circle cx="250" cy="252" r="168"/></clipPath><circle cx="250" cy="252" r="168" fill="#9db4de"/><circle cx="228" cy="230" r="168" fill="url(#mf3d-full-moon-moong)" clip-path="url(#mf3d-full-moon-fmclip)"/><g clip-path="url(#mf3d-full-moon-fmclip)"><circle cx="188" cy="196" r="34" fill="#8ba6d8" opacity="0.75"/><circle cx="196" cy="204" r="24" fill="#a9bde4" opacity="0.9"/><circle cx="292" cy="288" r="26" fill="#8ba6d8" opacity="0.7"/><circle cx="298" cy="294" r="17" fill="#a9bde4" opacity="0.85"/><circle cx="160" cy="312" r="18" fill="#8ba6d8" opacity="0.65"/><circle cx="310" cy="160" r="14" fill="#8ba6d8" opacity="0.6"/><circle cx="398" cy="270" r="22" fill="#8ba6d8" opacity="0.6"/><circle cx="240" cy="382" r="15" fill="#8ba6d8" opacity="0.55"/></g><ellipse cx="164" cy="132" rx="44" ry="14" fill="#ffffff" opacity="0.85" transform="rotate(-34 164 132)"/><g class="a-twinkle" fill="#ffb023"><polygon points="448.0,88.0 454.9,106.5 474.6,107.3 459.2,119.6 464.5,138.7 448.0,127.8 431.5,138.7 436.8,119.6 421.4,107.3 441.1,106.5"/></g><g class="a-twinkle" style="animation-delay:1.1s" fill="#fcb646"><polygon points="456.0,311.0 460.1,323.9 473.0,328.0 460.1,332.1 456.0,345.0 451.9,332.1 439.0,328.0 451.9,323.9"/></g><circle class="a-twinkle" style="animation-delay:.6s" cx="80" cy="120" r="6" fill="#fcb646"/><circle class="a-twinkle" style="animation-delay:1.8s" cx="62" cy="330" r="5" fill="#ffb023"/></svg>