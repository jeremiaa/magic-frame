<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><style>@keyframes mf3dspin{to{transform:rotate(360deg)}}.a-spin{animation:mf3dspin 80s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes mf3dbob{0%,100%{transform:translateX(0)}50%{transform:translateX(9px)}}.a-bob{animation:mf3dbob 7s ease-in-out infinite}@keyframes mf3dbob2{0%,100%{transform:translateX(0)}50%{transform:translateX(-11px)}}.a-bob2{animation:mf3dbob2 9s ease-in-out infinite}@keyframes mf3dfall{0%{transform:translateY(-12px);opacity:0}22%{opacity:1}70%{opacity:1}100%{transform:translateY(24px);opacity:0}}.a-fall{animation:mf3dfall 1.7s linear infinite}@keyframes mf3ddrift{0%{transform:translate(0,-12px) rotate(0deg);opacity:0}25%{opacity:1}70%{opacity:1}100%{transform:translate(7px,22px) rotate(38deg);opacity:0}}.a-drift{animation:mf3ddrift 3.2s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes mf3dflash{0%,7%,100%{opacity:1}2%{opacity:.1}4%{opacity:.95}5%{opacity:.5}}.a-flash{animation:mf3dflash 3.8s linear infinite}@keyframes mf3dslide{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}.a-slide{animation:mf3dslide 6s ease-in-out infinite}@keyframes mf3dslider{0%,100%{transform:translateX(0)}50%{transform:translateX(-14px)}}.a-slide-r{animation:mf3dslider 6s ease-in-out infinite}@keyframes mf3dtwinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}.a-twinkle{animation:mf3dtwinkle 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><linearGradient id="mf3d-partly-night-moong" x1="0" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="#eef4fc"/><stop offset="1" stop-color="#a7bce6"/></linearGradient><linearGradient id="mf3d-partly-night-cloudg" x1="0" y1="120" x2="0" y2="330" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f7fafd"/><stop offset="1" stop-color="#d9e5f5"/></linearGradient></defs><mask id="mf3d-partly-night-mpn"><rect x="-300" y="-300" width="1112" height="1112" fill="#000"/><circle cx="190" cy="152" r="106.0" fill="#fff"/><circle cx="268.0" cy="90.0" r="99.64" fill="#000"/></mask><g mask="url(#mf3d-partly-night-mpn)"><circle cx="190" cy="152" r="106.0" fill="url(#mf3d-partly-night-moong)"/><circle cx="135.0" cy="142.0" r="20.0" fill="#8ba6d8" opacity="0.75"/><circle cx="168.0" cy="214.0" r="14.0" fill="#8ba6d8" opacity="0.7"/><circle cx="118.0" cy="198.0" r="9.0" fill="#8ba6d8" opacity="0.65"/><ellipse cx="138.0" cy="40.0" rx="34.0" ry="11.0" fill="#ffffff" opacity="0.85" transform="rotate(-32 138.0 40.0)"/></g><g class="a-twinkle" fill="#ffb023"><polygon points="388.0,74.0 393.4,88.5 408.9,89.2 396.8,98.9 400.9,113.8 388.0,105.2 375.1,113.8 379.2,98.9 367.1,89.2 382.6,88.5"/></g><circle class="a-twinkle" style="animation-delay:1.3s" cx="438" cy="180" r="6" fill="#fcb646"/><g transform="translate(72,132) scale(0.78)"><g class="a-bob"><g fill="#c2d3ee" transform="translate(3,13)"><rect x="132" y="210" width="248" height="100" rx="46"/><circle cx="172" cy="244" r="64"/><circle cx="258" cy="214" r="88"/><circle cx="342" cy="246" r="60"/></g><g fill="url(#mf3d-partly-night-cloudg)"><rect x="132" y="210" width="248" height="100" rx="46"/><circle cx="172" cy="244" r="64"/><circle cx="258" cy="214" r="88"/><circle cx="342" cy="246" r="60"/></g><ellipse cx="234" cy="158" rx="24" ry="8" fill="#ffffff" opacity="0.85" transform="rotate(-14 234 158)"/><ellipse cx="156" cy="214" rx="12" ry="6" fill="#ffffff" opacity="0.65" transform="rotate(-30 156 214)"/></g></g></svg>