<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><style>@keyframes mf3dspin{to{transform:rotate(360deg)}}.a-spin{animation:mf3dspin 80s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes mf3dbob{0%,100%{transform:translateX(0)}50%{transform:translateX(9px)}}.a-bob{animation:mf3dbob 7s ease-in-out infinite}@keyframes mf3dbob2{0%,100%{transform:translateX(0)}50%{transform:translateX(-11px)}}.a-bob2{animation:mf3dbob2 9s ease-in-out infinite}@keyframes mf3dfall{0%{transform:translateY(-12px);opacity:0}22%{opacity:1}70%{opacity:1}100%{transform:translateY(24px);opacity:0}}.a-fall{animation:mf3dfall 1.7s linear infinite}@keyframes mf3ddrift{0%{transform:translate(0,-12px) rotate(0deg);opacity:0}25%{opacity:1}70%{opacity:1}100%{transform:translate(7px,22px) rotate(38deg);opacity:0}}.a-drift{animation:mf3ddrift 3.2s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes mf3dflash{0%,7%,100%{opacity:1}2%{opacity:.1}4%{opacity:.95}5%{opacity:.5}}.a-flash{animation:mf3dflash 3.8s linear infinite}@keyframes mf3dslide{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}.a-slide{animation:mf3dslide 6s ease-in-out infinite}@keyframes mf3dslider{0%,100%{transform:translateX(0)}50%{transform:translateX(-14px)}}.a-slide-r{animation:mf3dslider 6s ease-in-out infinite}@keyframes mf3dtwinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}.a-twinkle{animation:mf3dtwinkle 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><linearGradient id="mf3d-moon-moong" x1="0" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="#eef4fc"/><stop offset="1" stop-color="#a7bce6"/></linearGradient></defs><mask id="mf3d-moon-moonmask"><rect x="-300" y="-300" width="1112" height="1112" fill="#000"/><circle cx="222" cy="266" r="168.0" fill="#fff"/><circle cx="300.0" cy="204.0" r="157.92" fill="#000"/></mask><g mask