<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><style>@keyframes mf3dspin{to{transform:rotate(360deg)}}.a-spin{animation:mf3dspin 80s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes mf3dbob{0%,100%{transform:translateX(0)}50%{transform:translateX(9px)}}.a-bob{animation:mf3dbob 7s ease-in-out infinite}@keyframes mf3dbob2{0%,100%{transform:translateX(0)}50%{transform:translateX(-11px)}}.a-bob2{animation:mf3dbob2 9s ease-in-out infinite}@keyframes mf3dfall{0%{transform:translateY(-12px);opacity:0}22%{opacity:1}70%{opacity:1}100%{transform:translateY(24px);opacity:0}}.a-fall{animation:mf3dfall 1.7s linear infinite}@keyframes mf3ddrift{0%{transform:translate(0,-12px) rotate(0deg);opacity:0}25%{opacity:1}70%{opacity:1}100%{transform:translate(7px,22px) rotate(38deg);opacity:0}}.a-drift{animation:mf3ddrift 3.2s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes mf3dflash{0%,7%,100%{opacity:1}2%{opacity:.1}4%{opacity:.95}5%{opacity:.5}}.a-flash{animation:mf3dflash 3.8s linear infinite}@keyframes mf3dslide{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}.a-slide{animation:mf3dslide 6s ease-in-out infinite}@keyframes mf3dslider{0%,100%{transform:translateX(0)}50%{transform:translateX(-14px)}}.a-slide-r{animation:mf3dslider 6s ease-in-out infinite}@keyframes mf3dtwinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}.a-twinkle{animation:mf3dtwinkle 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><linearGradient id="mf3d-thunder-darkg" x1="0" y1="120" x2="0" y2="330" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#d3e0f3"/><stop offset="1" stop-color="#a9c0e6"/></linearGradient><linearGradient id="mf3d-thunder-boltg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc247"/><stop offset="1" stop-color="#ffa413"/></linearGradient></defs><g class="a-flash"><g transform="translate(248,252) scale(1.5)"><path d="M14,0 L-34,84 L2,84 L-22,160 L62,52 L18,52 L48,0 Z" fill="#fb4634" transform="translate(9,8)"/><path d="M14,0 L-34,84 L2,84 L-22,160 L62,52 L18,52 L48,0 Z" fill="url(#mf3d-thunder-boltg)"/></g></g><g class="a-flash" style="animation-delay:.25s"><path d="M14,0 L-34,84 L2,84 L-22,160 L62,52 L18,52 L48,0 Z" fill="#fb4634" transform="translate(384,332) scale(0.62)"/></g><g transform="translate(0,-36) scale(0.94)"><g class="a-bob"><g fill="#8ca7d8" transform="translate(3,13)"><rect x="132" y="210" width="248" height="100" rx="46"/><circle cx="172" cy="244" r="64"/><circle cx="258" cy="214" r="88"/><circle cx="342" cy="246" r="60"/></g><g fill="url(#mf3d-thunder-darkg)"><rect x="132" y="210" width="248" height="100" rx="46"/><circle cx="172" cy="244" r="64"/><circle cx="258" cy="214" r="88"/><circle cx="342" cy="246" r="60"/></g><ellipse cx="234" cy="158" rx="24" ry="8" fill="#eef4fc" opacity="0.85" transform="rotate(-14 234 158)"/><ellipse cx="156" cy="214" rx="12" ry="6" fill="#eef4fc" opacity="0.65" transform="rotate(-30 156 214)"/></g></g></svg>