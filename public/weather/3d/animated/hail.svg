<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><style>@keyframes mf3dspin{to{transform:rotate(360deg)}}.a-spin{animation:mf3dspin 80s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes mf3dbob{0%,100%{transform:translateX(0)}50%{transform:translateX(9px)}}.a-bob{animation:mf3dbob 7s ease-in-out infinite}@keyframes mf3dbob2{0%,100%{transform:translateX(0)}50%{transform:translateX(-11px)}}.a-bob2{animation:mf3dbob2 9s ease-in-out infinite}@keyframes mf3dfall{0%{transform:translateY(-12px);opacity:0}22%{opacity:1}70%{opacity:1}100%{transform:translateY(24px);opacity:0}}.a-fall{animation:mf3dfall 1.7s linear infinite}@keyframes mf3ddrift{0%{transform:translate(0,-12px) rotate(0deg);opacity:0}25%{opacity:1}70%{opacity:1}100%{transform:translate(7px,22px) rotate(38deg);opacity:0}}.a-drift{animation:mf3ddrift 3.2s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes mf3dflash{0%,7%,100%{opacity:1}2%{opacity:.1}4%{opacity:.95}5%{opacity:.5}}.a-flash{animation:mf3dflash 3.8s linear infinite}@keyframes mf3dslide{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}.a-slide{animation:mf3dslide 6s ease-in-out infinite}@keyframes mf3dslider{0%,100%{transform:translateX(0)}50%{transform:translateX(-14px)}}.a-slide-r{animation:mf3dslider 6s ease-in-out infinite}@keyframes mf3dtwinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}.a-twinkle{animation:mf3dtwinkle 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><linearGradient id="mf3d-hail-cloudg" x1="0" y1="120" x2="0" y2="330" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f7fafd"/><stop offset="1" stop-color="#d9e5f5"/></linearGradient><radialGradient id="mf3d-hail-hailg" cx="0.35" cy="0.3" r="0.85"><stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#ddeaf8"/><stop offset="1" stop-color="#7fa0d5"/