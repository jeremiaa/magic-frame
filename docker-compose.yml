# Magic Frame Stack
#
# Note: The Postgres DB name (POSTGRES_DB / DATABASE_URL path) is still
# `magicdashboard` — deliberately NOT renamed so existing installations
# can upgrade to new releases without data loss. The app code references
# the DB only via DATABASE_URL; the name is just an internal identifier.
#
# External Postgres database:
#   Set DATABASE_URL in .env to your own Postgres server.
#   Start WITHOUT the db service: `docker compose up` (the db service has
#   the "db" profile, so it's excluded by default).
#   With the internal DB: `docker compose --profile db up`.
#
# Caddy is always included and handles reverse proxy + automatic HTTPS
# (via Let's Encrypt). By default (no domain configured), Caddy simply
# acts as a transparent HTTP proxy on :80 → app:3000.
# Once a domain + ACME email are set in the app, the app generates a new
# Caddyfile and triggers a reload — Caddy fetches the cert.
#
# The app listens only internally on 3000 (Compose network), not directly
# on the host. If you want the old direct-:80 mode, you can set
# `ports: ["80:3000"]` on `app` and move Caddy to a different port —
# but then automatic HTTPS won't work.

services:
  app:
    # Default: pre-built multi-arch image from ghcr.io (fast, no local
    # build — especially on Pi). `build:` stays active as opt-in:
    # `docker compose up -d --build` (or install.sh --build) still builds
    # from source. Both paths work. (#9)
    image: ghcr.io/jeremiaa/magic-frame-app:${MAGIC_FRAME_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/magicdashboard?schema=public}
      - NODE_ENV=production
      # Host timezone passthrough (#73): the installer writes TZ into .env.
      # Empty/unset = UTC — existing installations are unchanged.
      - TZ=${TZ:-}
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-}
      - APP_BASE_URL=${APP_BASE_URL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - MS_CLIENT_ID=${MS_CLIENT_ID:-}
      - MS_CLIENT_SECRET=${MS_CLIENT_SECRET:-}
      - OPENWEATHERMAP_API_KEY=${OPENWEATHERMAP_API_KEY:-}
      # Caddy admin API for reloads. Default URL of the sidecar container.
      - CADDY_ADMIN_URL=${CADDY_ADMIN_URL:-http://caddy:2019}
      # Kill switch for the entity allow-list on /api/ha/action (set to "1"
      # to disable it). Must live HERE and not just in .env: the app
      # service has an explicit environment list, and Compose otherwise
      # only passes .env for interpolation in this file — the variable
      # would never reach the container.
      - MAGIC_FRAME_HA_ACTION_UNRESTRICTED=${MAGIC_FRAME_HA_ACTION_UNRESTRICTED:-}
      # Number of reverse proxies in front of Magic Frame (see .env.example).
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-1}
    volumes:
      - magic_configs:/app/configs
      - magic_wallpapers:/app/wallpapers
      # Shared Caddy config volume — app writes Caddyfile, Caddy reads it.
      - magic_caddy_config:/caddy/config

  caddy:
    # Pre-built image (see app). `build:` remains the opt-in from-source path.
    image: ghcr.io/jeremiaa/magic-frame-caddy:${MAGIC_FRAME_VERSION:-latest}
    build:
      context: ./caddy
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Host timezone passthrough (#73), see app.
      - TZ=${TZ:-}
    # Host ports. Default 80/443, overridable via .env (HTTP_PORT / HTTPS_PORT)
    # if the standard ports are taken on the host. Unset variables fall back
    # to 80/443 — existing installations are unchanged.
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
      # Admin API: bind to localhost only — no remote access desired.
      - "127.0.0.1:2019:2019"
    volumes:
      # Caddyfile directory (writeable by app, read by Caddy)
      - magic_caddy_config:/etc/caddy
      # Persistent ACME state (certs, account keys)
      - magic_caddy_data:/data
      - magic_caddy_conf:/config
    depends_on:
      - app

  db:
    profiles: ["db"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: magicdashboard
      # Host timezone passthrough (#73), see app. Stored timestamps remain
      # UTC (Prisma normalises) — TZ only affects log/session defaults.
      TZ: ${TZ:-}
    # No `ports:` — the database is reachable over the Compose network as
    # `db:5432`, and that's all anyone needs: the app connects via
    # DATABASE_URL, documented backups run via `docker compose exec db pg_dump`.
    #
    # There used to be `- "5432:5432"` here. That exposed a superuser login
    # with postgres/postgres to the entire network — password hashes, TOTP
    # secrets, shortcut tokens, the Home Assistant token, and calendar tokens
    # included. A published Docker port also bypasses the host firewall,
    # remaining open even when ufw blocks the port.
    #
    # If you really need it (pgAdmin, DBeaver), add a
    # docker-compose.override.yml alongside — Compose merges it automatically
    # and an update never touches it:
    #   services:
    #     db:
    #       ports:
    #         - "127.0.0.1:5432:5432"
    volumes:
      - magic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  magic_configs:
  magic_wallpapers:
  magic_pgdata:
  magic_caddy_config:
  magic_caddy_data:
  magic_caddy_conf:
