  namespace: magic-frame
  labels:
    app: magic-frame-app
spec:
  type: ClusterIP
  ports:
    - name: mf-port
      protocol: TCP
      port: 3000
      targetPort: 3000
  selector:
    app: magic-frame-app
---
# Source: magic-frame/templates/app.yaml
apiVersion: v1
kind: Service
metadata:
  name: magic-frame-nocaddy
  namespace: magic-frame
spec:
  type: NodePort
  ports:
    - name: http
      protocol: TCP
      port: 3080
      targetPort: 3000
      nodePort: 30080
    - name: https
      protocol: TCP
      port: 3443
      targetPort: 3000
      nodePort: 30443
  selector:
    app: magic-frame-app
---
# Source: magic-frame/templates/app.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: magic-frame-app
  namespace: magic-frame
  labels:
    app: magic-frame-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: magic-frame-app
  strategy:
    type: Recreate
  # Inside templates/app.yaml
  template:
    metadata:
      labels:
        app: magic-frame-app
      annotations:
        checksum/config: f729fb00caca5aff7b5f0db0ae34b251f989be461828a2bf950a424693b3a880
        checksum/secret: 3c0a04c8c497834da50b2372caad3fa70bccc359a40c166cd5bb2e781e619f22
    spec:
      containers:
        - name: magic-frame-app
          image: "ghcr.io/jeremiaa/magic-frame-app:latest"
          imagePullPolicy: Always
          # Load from BOTH the ConfigMap and the Secret
          envFrom:
            - configMapRef:
                name: magic-frame-env
            - secretRef:
                name: magic-frame-secrets
          ports:
            - containerPort: 3000
              protocol: TCP
          volumeMounts:
            - mountPath: /app/configs
              name: magic-frame-configs-pvc
            - mountPath: /app/wallpapers
              name: magic-frame-wallpapers-pvc
      restartPolicy: Always
      volumes:
        - name: magic-frame-configs-pvc
          persistentVolumeClaim:
            claimName: magic-frame-configs-pvc
        - name: magic-frame-wallpapers-pvc
          persistentVolumeClaim:
            claimName: magic-frame-wallpapers-pvc
