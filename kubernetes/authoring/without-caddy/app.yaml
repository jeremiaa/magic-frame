---
# Source: magic-frame/templates/app.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: magic-frame-app
  namespace: magic-frame
  labels:
    app: magic-frame-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: magic-frame-app
  strategy:
    type: Recreate
  # Inside templates/app.yaml
  template:
    metadata:
      labels:
        app: magic-frame-app
      annotations:
        checksum/config: 43e139a01e361bd8ecda098da18132950512406f36f99b823e65a13871ca638f
        checksum/secret: ab5c3dc32377f1a21f347c88e16ea8440d881f26a1edf4260dedd8b5016ff721
    spec:
      containers:
        - name: magic-frame-app
          image: "magic-frame-app:latest"
          imagePullPolicy: Never
          # Load from BOTH the ConfigMap and the Secret
          envFrom:
            - configMapRef:
                name: magic-frame-env
            - secretRef:
                name: magic-frame-secrets
          ports:
            - containerPort: 3000
              protocol: TCP
          volumeMounts:
            - mountPath: /app/configs
              name: magic-frame-configs-pvc
            - mountPath: /app/wallpapers
              name: magic-frame-wallpapers-pvc
      restartPolicy: Always
      volumes:
        - name: magic-frame-configs-pvc
          persistentVolumeClaim:
            claimName: magic-frame-configs-pvc
        - name: magic-frame-wallpapers-pvc
          persistentVolumeClaim:
            claimName: magic-frame-wallpapers-pvc
