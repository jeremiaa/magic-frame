# Source: magic-frame/templates/app.yaml
apiVersion: v1
kind: Service
metadata:
  name: magic-frame-nocaddy
  namespace: magic-frame
spec:
  type: NodePort
  ports:
    - name: http
      protocol: TCP
      port: 3080
      targetPort: 3000
      nodePort: 30080
    - name: https
      protocol: TCP
      port: 3443
      targetPort: 3000
      nodePort: 30443
